services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kaihle_postgres
    environment:
      POSTGRES_USER: kaihle
      POSTGRES_PASSWORD: kaihle
      POSTGRES_DB: kaihle
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaihle -d kaihle"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kaihle_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaihle_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kaihle:kaihle@postgres:5432/kaihle
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaihle_celery
    command: celery -A app.tasks.celery_app worker --pool=threads --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kaihle:kaihle@postgres:5432/kaihle
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # LOCAL DEVELOPMENT
  # 
  # For frontend development, run directly on host to avoid Docker/macOS issues:
  #
  #   cd frontend
  #   pnpm install          # Install dependencies
  #   pnpm dev:teacher      # Run specific app (ports 3001-3005)
  #
  # This uses the SAME pnpm-lock.yaml ensuring identical versions as production.
  # ============================================================================

  # ============================================================================
  # PRODUCTION / CI
  # - Uses Dockerfile which installs dependencies during build
  # - No volumes (everything included in image)
  # - Uses same lock file versions as local
  # ============================================================================
  frontend-teacher:
    build:
      context: ./frontend
      dockerfile: apps/teacher/Dockerfile
    container_name: kaihle_teacher
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
      - postgres
      - redis

  frontend-student:
    build:
      context: ./frontend
      dockerfile: apps/student/Dockerfile
    container_name: kaihle_student
    ports:
      - "3002:3002"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  frontend-parent:
    build:
      context: ./frontend
      dockerfile: apps/parent/Dockerfile
    container_name: kaihle_parent
    ports:
      - "3003:3003"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  frontend-school-admin:
    build:
      context: ./frontend
      dockerfile: apps/school-admin/Dockerfile
    container_name: kaihle_school_admin
    ports:
      - "3004:3004"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  frontend-kaihle-admin:
    build:
      context: ./frontend
      dockerfile: apps/kaihle-admin/Dockerfile
    container_name: kaihle_admin
    ports:
      - "3005:3005"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
