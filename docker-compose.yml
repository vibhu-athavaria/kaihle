services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kaihle_postgres
    environment:
      POSTGRES_USER: kaihle
      POSTGRES_PASSWORD: kaihle
      POSTGRES_DB: kaihle
    ports:
      - "5433:5432"  # Host port 5433 to avoid conflicts with local PostgreSQL on 5432.
                     # CI uses port 5432 (GitHub Actions service containers use standard ports).
                     # Tests run locally should use: DATABASE_URL=...@localhost:5433/...
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaihle -d kaihle"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kaihle_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaihle_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kaihle:kaihle@postgres:5432/kaihle
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaihle_celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kaihle:kaihle@postgres:5432/kaihle
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-teacher:
    build:
      context: ./frontend
      dockerfile: apps/teacher/Dockerfile.dev
    container_name: kaihle_teacher
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

  frontend-student:
    build:
      context: ./frontend
      dockerfile: apps/student/Dockerfile.dev
    container_name: kaihle_student
    ports:
      - "3002:3002"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

  frontend-parent:
    build:
      context: ./frontend
      dockerfile: apps/parent/Dockerfile.dev
    container_name: kaihle_parent
    ports:
      - "3003:3003"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

  frontend-school-admin:
    build:
      context: ./frontend
      dockerfile: apps/school-admin/Dockerfile.dev
    container_name: kaihle_school_admin
    ports:
      - "3004:3004"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

  frontend-kaihle-admin:
    build:
      context: ./frontend
      dockerfile: apps/kaihle-admin/Dockerfile.dev
    container_name: kaihle_admin
    ports:
      - "3005:3005"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

volumes:
  postgres_data:
  redis_data:
