name: Deploy

on:
  # Only runs after CI passes on main — never deploys broken code
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    # Double-check: only deploy if the CI run that triggered us actually passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # ─────────────────────────────────────────────────────────────────────────
    # RENDER PRE-DEPLOY COMMAND (set in Render dashboard, not here):
    #   alembic upgrade head
    #
    # This must be configured under:
    #   Render Dashboard → kaihle-backend service → Settings → Pre-Deploy Command
    #
    # The deploy trigger below starts the deploy. Render runs the pre-deploy
    # command before routing traffic to the new instance — so migrations always
    # run before new code goes live.
    # ─────────────────────────────────────────────────────────────────────────
    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
            -H "Content-Type: application/json" \
            -d '{}'

  deploy-frontend:
    name: Deploy Frontend to Render
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (teacher app)
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_TEACHER_SERVICE_ID }}/deploys" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Trigger Render deploy (student app)
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_STUDENT_SERVICE_ID }}/deploys" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Trigger Render deploy (parent app)
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_PARENT_SERVICE_ID }}/deploys" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Trigger Render deploy (school-admin app)
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SCHOOL_ADMIN_SERVICE_ID }}/deploys" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Trigger Render deploy (kaihle-admin app)
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_KAIHLE_ADMIN_SERVICE_ID }}/deploys" \
            -H "Content-Type: application/json" \
            -d '{}'