name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:

  # ─── CHANGE DETECTION ─────────────────────────────────────────────────────

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ─── BACKEND ──────────────────────────────────────────────────────────────

  lint-backend:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --all-extras
        working-directory: backend

      # ruff check: does NOT auto-fix — surfaces violations explicitly
      - name: Run ruff lint
        run: uv run ruff check .
        working-directory: backend

      # ruff format --check: fails if formatting differs from pre-commit's ruff-format
      - name: Run ruff format check
        run: uv run ruff format --check .
        working-directory: backend

      - name: Run mypy
        run: uv run mypy app/
        working-directory: backend

  test-backend:
    name: Backend Tests (unit + integration)
    runs-on: ubuntu-latest
    needs: [changes, lint-backend]
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kaihle
          POSTGRES_PASSWORD: kaihle
          POSTGRES_DB: kaihle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://kaihle:kaihle@localhost:5432/kaihle_test
      # Integration tests deliberately ignore DATABASE_URL — inheriting it once wiped a
      # live database — so the test target must be named explicitly. The service above
      # listens on 5432; the local default is 5433.
      TEST_DATABASE_URL: postgresql+asyncpg://kaihle:kaihle@localhost:5432/kaihle_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET_KEY: test-secret-key-for-ci-only-not-production
      JWT_ALGORITHM: HS256
      RESEND_API_KEY: test-key
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --all-extras
        working-directory: backend

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=kaihle psql -h localhost -U kaihle -d kaihle_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: uv run alembic upgrade head
        working-directory: backend

      # Runs ALL tests (unit + integration) with 80% coverage gate
      - name: Run pytest with coverage
        run: |
          uv run pytest app/tests/ \
            --cov=app/services \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v
        working-directory: backend

  # ─── FRONTEND ─────────────────────────────────────────────────────────────

  lint-frontend:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      # pnpm MUST be installed before setup-node so the cache key can be resolved
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: TypeScript type check
        run: |
          pnpm --filter parent exec tsc --noEmit
          pnpm --filter student exec tsc --noEmit
          pnpm --filter teacher exec tsc --noEmit
          pnpm --filter @kaihle/school-admin exec tsc --noEmit
          pnpm --filter @kaihle/kaihle-admin exec tsc --noEmit
        working-directory: frontend

      - name: Run prettier check
        run: pnpm exec prettier --check "**/*.{ts,tsx,json,css}" --ignore-path=".prettierignore"
        working-directory: frontend

      # ESLint disabled — requires full monorepo ESLint setup (see M0-1-T1)
      # - name: Run eslint
      #   run: pnpm lint
      #   working-directory: frontend

  test-frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [changes, lint-frontend]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      # No "|| true" — real test failures will correctly fail this job
      - name: Run Jest tests
        run: |
          pnpm --filter parent exec jest --passWithNoTests --coverage
          pnpm --filter student exec jest --passWithNoTests --coverage
          pnpm --filter teacher exec jest --passWithNoTests --coverage
          pnpm --filter @kaihle/school-admin exec jest --passWithNoTests --coverage
          pnpm --filter @kaihle/kaihle-admin exec jest --passWithNoTests --coverage
        working-directory: frontend

