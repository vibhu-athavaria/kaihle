repos:
  # ─── BACKEND ────────────────────────────────────────────────────────────────

  # Ruff: lint + import sorting (replaces isort/flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]           # auto-fixes imports + lint violations locally
        files: ^backend/
      - id: ruff-format         # format check (matches CI's `ruff format --check`)
        files: ^backend/

  # Mypy: type checks (matches CI's `mypy app/`)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend type check)
        entry: bash -c "cd backend && uv run mypy app/ --pretty --show-error-codes --show-column-numbers"
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false
        require_serial: true

  # Backend unit tests only (integration tests need Postgres/Redis — run in CI)
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests
        entry: bash -c "cd backend && uv run pytest app/tests/unit/ -v --tb=long --cov=app/services --cov-fail-under=80 --cov-report=term-missing"
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false
        require_serial: true

  # ─── FRONTEND ───────────────────────────────────────────────────────────────

  # Prettier: formatting check (matches CI's `prettier --check`)
  # Using pnpm exec prettier directly to match CI's version (v3.8.2 from package.json)
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (via pnpm)
        entry: bash -c 'PNPM=$(ls $HOME/.nvm/versions/node/*/bin/pnpm 2>/dev/null | head -1); [ -n "$PNPM" ] && export PATH="$(dirname $PNPM):$PATH"; cd frontend && pnpm exec prettier --check "**/*.{ts,tsx,json,css}" --ignore-path=.prettierignore'
        language: system
        files: ^frontend/
        types_or: [ts, tsx, json, css]
        pass_filenames: false
        exclude: "^frontend/dist/"

  # TypeScript: type check (matches CI's per-app tsc --noEmit)
  # Runs all apps unconditionally — && would stop at first failure and hide others
  - repo: local
    hooks:
      - id: tsc-check
        name: TypeScript type check (frontend)
        entry: >-
          bash -c '
            PNPM=$(ls $HOME/.nvm/versions/node/*/bin/pnpm 2>/dev/null | head -1); [ -n "$PNPM" ] && export PATH="$(dirname $PNPM):$PATH"
            cd frontend
            failed=0
            for app in parent student teacher @kaihle/school-admin @kaihle/kaihle-admin; do
              echo "\n=== tsc: $app ==="
              pnpm --filter "$app" exec tsc --noEmit || { echo "FAILED: $app"; failed=1; }
            done
            exit $failed
          '
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true

  # Frontend unit tests (Jest) — all apps run regardless of individual failures
  - repo: local
    hooks:
      - id: jest-unit
        name: jest unit tests (frontend)
        entry: >-
          bash -c '
            PNPM=$(ls $HOME/.nvm/versions/node/*/bin/pnpm 2>/dev/null | head -1); [ -n "$PNPM" ] && export PATH="$(dirname $PNPM):$PATH"
            cd frontend
            failed=0
            for app in parent student teacher @kaihle/school-admin @kaihle/kaihle-admin; do
              echo "\n=== jest: $app ==="
              pnpm --filter "$app" exec jest --passWithNoTests --verbose || { echo "FAILED: $app"; failed=1; }
            done
            exit $failed
          '
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true

  # ─── INFRA / YAML ───────────────────────────────────────────────────────────

  # actionlint: validates GitHub Actions YAML (catches syntax + semantic errors)
  # This replaces the basic check-yaml — actionlint is strictly a superset
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint
        types: [yaml]

  # General YAML syntax check for non-Actions YAML files (docker-compose, etc.)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        types: [yaml]
        exclude: ^\.github/   # actionlint already covers .github/ — no duplication
